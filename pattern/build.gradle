// Tiny full-screen test-pattern app that the phone app installs on the projector over ADB.
plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.keystone.pattern'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.keystone.pattern'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
    }
}
